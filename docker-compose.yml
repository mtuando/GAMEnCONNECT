services:
  db:
    image: postgres:17-alpine
    container_name: gamelink-db
    environment:
      POSTGRES_USER: gamelink_user
      POSTGRES_PASSWORD: gamelink_password
      POSTGRES_DB: gamelink_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelink_user -d gamelink_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gamelink-app
    user: "root"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gamelink_user:gamelink_password@db:5432/gamelink_db
      NODE_ENV: development
    ports:
      - "2132:2132"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - path: ./src
          action: rebuild
        - path: ./prisma
          action: rebuild
    command: npm run dev

volumes:
  postgres_data: